[package]
name = "hh27-starfish"
version = "0.1.0"
edition = "2021"
description = "Theoretical bare-metal firmware for the Hacker Hotel 2027 starfish badge (WCH CH643Q)"
license = "MIT"

[dependencies]
# registers only: no HAL (ch32-hal's CH643 support is not on crates.io,
# and with embassy it owned the EXTI interrupts)
ch32-metapac = { version = "0.1.1", features = ["ch643", "rt"] }
qingke = { version = "0.8", features = ["v4c", "critical-section-impl"] }
qingke-rt = { version = "0.8", features = ["v4c"] }
critical-section = "1"

[profile.release]
strip = false     # symbols are not flashed, keep them for debugging
lto = true
opt-level = "z"     # "s" is ~5 KB larger; the 62 KB flash is getting full
debug = true
codegen-units = 1
